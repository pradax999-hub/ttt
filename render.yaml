services:
  - type: web
    name: transferbyvan-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/webhook/ping
    disk:
      name: transferbyvan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/data.json
      - key: TRUST_PROXY_HOPS
        value: "1"
